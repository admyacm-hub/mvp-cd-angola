version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sdvm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sdvm_angola
      POSTGRES_USER: sdvm
      POSTGRES_PASSWORD: sdvm_demo_2025
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed-demo.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - sdvm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdvm -d sdvm_angola"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sdvm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: sdvm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://sdvm:sdvm_demo_2025@postgres:5432/sdvm_angola
      REDIS_URL: redis://redis:6379
      JWT_SECRET: demo-secret-change-in-production
      DEMO_MODE: "true"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:alpine
    container_name: sdvm-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sdvm_pgdata:
