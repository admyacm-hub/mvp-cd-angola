name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sdvm_test
          POSTGRES_USER: sdvm
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:init
        env:
          DATABASE_URL: postgres://sdvm:test@localhost:5432/sdvm_test
      - run: npm test
        env:
          DATABASE_URL: postgres://sdvm:test@localhost:5432/sdvm_test
          JWT_SECRET: test-secret

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sdvm-angola:test .
      - name: Smoke test
        run: |
          docker compose up -d
          sleep 15
          curl -sf http://localhost:3000/health || exit 1
          docker compose down
