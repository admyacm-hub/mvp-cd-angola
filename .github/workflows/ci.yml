name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check (informativo)
        run: |
          find src -name "*.js" -print0 2>/dev/null | xargs -0 -I {} node --check {} || echo "⚠ Sem src/ para validar — a continuar"

      - name: Tests (informativo)
        run: npm test || echo "⚠ Testes falharam — a continuar"
