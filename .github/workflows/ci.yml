name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sdvm_test
          POSTGRES_USER: sdvm
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://sdvm:test@localhost:5432/sdvm_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-ci
      DEMO_MODE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate structure
        run: |
          echo "→ A validar ficheiros essenciais…"
          for f in src/server.js package.json frontend/index.html; do
            if [ ! -f "$f" ]; then
              echo "❌ Ficheiro obrigatório ausente: $f"
              exit 1
            fi
            echo "✅ $f"
          done

      - name: Syntax check
        run: node --check src/server.js

      - name: Run tests
        run: |
          if npm run | grep -qE "^\s+test"; then
            npm test -- --passWithNoTests --ci
          else
            echo "⚠ Sem script de testes — a saltar"
          fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sdvm-angola:ci .

  pages:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend
      - id: deployment
        uses: actions/deploy-pages@v4
